<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mi Primera Página Web</title>

    <style>

        /* Estilos generales de la página */
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background-color: #f4f6f8;
            color: #333;
            text-align: center;
        }

        /* Encabezado */
        header {
            background-color: #1e2a3a;
            color: white;
            padding: 20px;
        }

        header h1 {
            margin: 0;
        }

        /* Contenedor principal */
        .contenedor {
            background-color: white;
            width: 70%;
            max-width: 800px;
            margin: 50px auto;
            padding: 40px;
            border-radius: 15px;

            box-shadow: 0px 4px 15px rgba(0,0,0,0.15);
        }

        /* Título principal */
        .contenedor h1 {
            font-size: 50px;
            color: #1e2a3a;
        }

        /* Subtítulos */
        h2 {
            color: #2c5d8a;
        }

        h3 {
            color: #198754;
            font-size: 28px;
        }

        /* Párrafo */
        p {
            font-size: 20px;
            line-height: 1.6;
        }

        /* Lista de tecnologías */
        ul {
            list-style: none;
            padding: 0;
            width: 300px;
            margin: auto;
        }

        li {
            background-color: #e9ecef;
            margin: 10px;
            padding: 15px;
            border-radius: 8px;
            font-size: 20px;
            transition: 0.3s;
        }

        /* Efecto cuando pasamos el mouse */
        li:hover {
            background-color: #198754;
            color: white;
            transform: scale(1.05);
        }

        /* Pie de página */
        footer {
            background-color: #1e2a3a;
            color: white;
            padding: 20px;
            margin-top: 30px;
        }

    </style>

</head>

<body>

    <!-- Encabezado de la página -->
    <header>
        <h1>Mi Primera Web</h1>
    </header>


    <!-- Contenido principal -->
    <main class="contenedor">

        <h1>¡Hola Mundo!</h1>

        <h2>Mi primera página web con Git y GitHub</h2>

        <h2>Bienvenidos todos</h2>

        <p>
            Esta página fue creada utilizando HTML
            y posteriormente será publicada en GitHub.
        </p>

        <h3>🚀 Mis tecnologías</h3>

        <ul>
            <li>🌐 HTML</li>
            <li>🔀 Git</li>
            <li>🐙 GitHub</li>
        </ul>

    </main>


    <!-- Pie de página -->
    <footer>
        <p>Hecho con ❤️ y mucho aprendizaje</p>
    </footer>

</body>

</html>
